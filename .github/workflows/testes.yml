
name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Coverage
        run: python -m pip install coverage

      - name: Executar testes
        run: python -m coverage run --source=familias -m unittest discover -s . -p "test_*.py" -v

      - name: Exibir cobertura
        run: python -m coverage report -m
